name: Test Ni no Kuni II Update Transfer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Connect GitHub Actions to iPhone over Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: 100.127.76.121

      - name: Download Ni no Kuni II update from PocketServer
        shell: bash
        run: |
          set -euo pipefail
          FILE="Ni no Kuni II Revenant Kingdom PRINCE'S EDITION Switch NSP Update v65536.rar"
          URL="$(python3 -c 'import sys, urllib.parse; print("http://100.127.76.121:65184/" + urllib.parse.quote(sys.argv[1]))' "$FILE")"
          echo "Checking PocketServer over Tailscale..."
          curl --fail --location --show-error --silent --head --connect-timeout 20 "$URL"
          echo "Downloading update from PocketServer..."
          START=$(date +%s)
          curl --fail --location --show-error --silent --retry 2 --connect-timeout 20 --max-time 900 \
            "$URL" --output ni-no-kuni-update.rar
          END=$(date +%s)
          SIZE=$(stat -c '%s' ni-no-kuni-update.rar)
          ELAPSED=$((END - START))
          echo "Downloaded bytes: $SIZE"
          echo "Elapsed seconds: $ELAPSED"
          if [ "$SIZE" -ne 93961342 ]; then
            echo "::error::Downloaded file size does not match expected 93961342 bytes"
            exit 1
          fi
          if [ "$ELAPSED" -gt 0 ]; then
            awk -v bytes="$SIZE" -v seconds="$ELAPSED" 'BEGIN { printf "Average speed: %.2f MB/s\n", bytes / seconds / 1000000 }'
          fi
          echo "PocketServer transfer test completed successfully."
