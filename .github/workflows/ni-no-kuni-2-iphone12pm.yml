name: Ni no Kuni II iPhone 12 Pro Max IPA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Inspect Drive files, survey the game, or build the IPA"
        type: choice
        required: true
        default: inspect
        options: [inspect, survey, build]

permissions:
  contents: read

concurrency:
  group: ni-no-kuni-2-iphone12pm
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 27.1
        if: ${{ inputs.mode != 'inspect' }}
        run: |
          set -euo pipefail
          test -d "/Applications/Xcode_27.1.app/Contents/Developer" || { echo "::error::Xcode 27.1 is not installed."; ls -d /Applications/Xcode*.app 2>/dev/null || true; exit 1; }
          sudo xcode-select -s "/Applications/Xcode_27.1.app/Contents/Developer"
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          grep -Fq "Xcode 27.1" "$RUNNER_TEMP/xcode-version.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET SDK
        if: ${{ inputs.mode != 'inspect' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Google Drive client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Inspect and download Ni no Kuni II Drive folder
        env:
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID || secrets.GDRIVE_FOLDER_ID || '1HRdSFbBgc8hF_s8GorLitsZhDS8qGq0s' }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
          PROD_KEYS_BASE64: ${{ secrets.PROD_KEYS_BASE64 }}
          BUILD_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          test -n "$GDRIVE_SERVICE_ACCOUNT_JSON" || { echo "::error::Missing GDRIVE_SERVICE_ACCOUNT_JSON secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/nino-drive/raw" "$RUNNER_TEMP/nino-drive/game" "$RUNNER_TEMP/nino-drive/keys"
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gdrive-service-account.json"
          chmod 600 "$RUNNER_TEMP/gdrive-service-account.json"
          cat > "$RUNNER_TEMP/drive_files.py" <<'PY'
          import os, pathlib, shutil, subprocess, re, base64
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "nino-drive"
          creds = service_account.Credentials.from_service_account_file(
              os.path.join(os.environ["RUNNER_TEMP"], "gdrive-service-account.json"),
              scopes=["https://www.googleapis.com/auth/drive.readonly"])
          drive = build("drive", "v3", credentials=creds, cache_discovery=False)
          queue, files = [(os.environ["GDRIVE_FOLDER_ID"], pathlib.Path(""))], []
          while queue:
              parent, rel = queue.pop(0)
              token = None
              while True:
                  page = drive.files().list(q=f"'{parent}' in parents and trashed=false",
                      fields="nextPageToken,files(id,name,mimeType,size)", pageToken=token, pageSize=1000).execute()
                  for item in page.get("files", []):
                      child = rel / item["name"]
                      if item["mimeType"] == "application/vnd.google-apps.folder":
                          queue.append((item["id"], child))
                      elif item["mimeType"] != "application/vnd.google-apps.shortcut":
                          files.append((item, child))
                  token = page.get("nextPageToken")
                  if not token: break

          if not files: raise SystemExit("Drive folder is accessible but contains no downloadable files.")
          print(f"Drive access confirmed; {len(files)} file(s) found:")
          for f, p in sorted(files, key=lambda x: str(x[1]).lower()):
              print(f"  {p} ({int(f.get('size', 0)):,} bytes)")
          if os.environ["BUILD_MODE"] == "inspect":
              raise SystemExit(0)

          def download(item, dest):
              dest.parent.mkdir(parents=True, exist_ok=True)
              req = drive.files().get_media(fileId=item["id"])
              with dest.open("wb") as out:
                  transfer = MediaIoBaseDownload(out, req, chunksize=8*1024*1024)
                  done = False
                  while not done:
                      status, done = transfer.next_chunk()
                      if status: print(f"{dest.name}: {int(status.progress()*100)}%")

          keys = [(f,p) for f,p in files if p.name.lower() == "prod.keys"]
          if len(keys) > 1: raise SystemExit("Multiple prod.keys files found in Drive.")
          key = root / "keys" / "prod.keys"
          b64 = os.environ.get("PROD_KEYS_BASE64", "").strip()
          plain = os.environ.get("PROD_KEYS", "").strip()
          if b64: key.write_bytes(base64.b64decode(b64, validate=True))
          elif plain: key.write_text(plain, encoding="utf-8")
          elif keys: download(keys[0][0], key)
          else: raise SystemExit("No prod.keys found. Configure PROD_KEYS/PROD_KEYS_BASE64 or put prod.keys in Drive.")
          if not key.stat().st_size: raise SystemExit("prod.keys is empty.")

          total = sum(int(f.get("size",0)) for f,p in files if p.name.lower() != "prod.keys")
          free = shutil.disk_usage(root).free
          required = max(10*1024**3, int(total*2.2))
          print(f"Download size {total:,}; free disk {free:,}; required estimate {required:,}.")
          if free < required: raise SystemExit("Insufficient runner disk space for extraction/build.")
          for f,p in files:
              if p.name.lower() != "prod.keys": download(f, root / "raw" / p)

          archive_roots = []
          for p in (root/"raw").rglob("*"):
              if not p.is_file(): continue
              n = p.name.lower()
              if n.endswith((".rar",".zip",".7z")):
                  if re.search(r"\.part\d+\.rar$",n) and not re.search(r"\.part0*1\.rar$",n): continue
                  archive_roots.append(p)
              elif re.search(r"\.0*1$",n):
                  archive_roots.append(p)
          if archive_roots:
              seven = shutil.which("7zz") or shutil.which("7z")
              if not seven: raise SystemExit("7-Zip is required to extract the multipart game archive.")
              for p in sorted(archive_roots):
                  print(f"Extracting {p.name}")
                  subprocess.run([seven,"x","-y",f"-o{root/'game'}",str(p)],check=True)

          ext = {".nsp",".nsz",".xci",".xcz"}
          for p in (root/"raw").rglob("*"):
              if p.is_file() and p.suffix.lower() in ext:
                  dest = root/"game"/p.name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  if not dest.exists(): shutil.copy2(p,dest)
          packages = [p for p in (root/"game").rglob("*") if p.is_file() and p.suffix.lower() in ext]
          if not packages: raise SystemExit("No NSP/NSZ/XCI/XCZ packages found after extraction.")
          print(f"Prepared {len(packages)} NXNative package(s):")
          for p in sorted(packages): print(f"  {p.name} ({p.stat().st_size:,} bytes)")
          PY
          python "$RUNNER_TEMP/drive_files.py"
          rm -f "$RUNNER_TEMP/gdrive-service-account.json"

      - name: Install NXNative dependencies
        if: ${{ inputs.mode == 'survey' || inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang sevenzip
          python -m pip install --upgrade pip
          python -m pip install lz4 "capstone>=5,<6" fonttools backports.zstd

      - name: Generate Ni no Kuni II survey
        if: ${{ inputs.mode == 'survey' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nino-work"
          python scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/nino-drive/game" \
            --keys "$RUNNER_TEMP/nino-drive/keys/prod.keys" \
            --survey-only --work-dir "$RUNNER_TEMP/nino-work" --progress lines

      - name: Upload game survey
        if: ${{ inputs.mode == 'survey' }}
        uses: actions/upload-artifact@v4
        with:
          name: Ni-no-Kuni-II-game-survey
          path: ${{ runner.temp }}/nino-drive/game/*_survey/
          if-no-files-found: error
          retention-days: 7

      - name: Build Ni no Kuni II 6 GB iPhone IPA
        if: ${{ inputs.mode == 'build' }}
        env:
          DM_GAMES_DIR: ${{ github.workspace }}/dm/games
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nino-work"
          python scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/nino-drive/game" \
            --keys "$RUNNER_TEMP/nino-drive/keys/prod.keys" \
            --platform ios --6gb \
            --work-dir "$RUNNER_TEMP/nino-work" \
            --out "$RUNNER_TEMP/Ni-no-Kuni-II-iPhone12ProMax.ipa" \
            --progress lines

      - name: Upload Ni no Kuni II IPA
        if: ${{ inputs.mode == 'build' }}
        uses: actions/upload-artifact@v4
        with:
          name: Ni-no-Kuni-II-iPhone12ProMax-IPA
          path: ${{ runner.temp }}/Ni-no-Kuni-II-iPhone12ProMax.ipa
          if-no-files-found: error
          retention-days: 7
