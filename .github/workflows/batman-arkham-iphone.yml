name: Batman Arkham iPhone — Drive validation (trigger check)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/batman-arkham-asylum-port

permissions:
  contents: read

concurrency:
  group: batman-arkham-drive-validation
  cancel-in-progress: false

jobs:
  validate-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Drive client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Validate shared game folder and inventory files
        env:
          GDRIVE_FOLDER_ID: '1Eqgn7tmDjbnlU7FK2KXBI4EV39uiHQ5t'
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test -n "$GDRIVE_FOLDER_ID" || { echo "::error::Missing GDRIVE_FOLDER_ID"; exit 1; }
          test -n "$GDRIVE_SERVICE_ACCOUNT_JSON" || { echo "::error::Missing GDRIVE_SERVICE_ACCOUNT_JSON secret. Share the Drive folder with the service-account email, then add its JSON key as this repository secret."; exit 1; }
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gdrive-service-account.json"
          chmod 600 "$RUNNER_TEMP/gdrive-service-account.json"
          cat > "$RUNNER_TEMP/inventory_drive.py" <<'PY'
          import json, os, pathlib
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          folder_id = os.environ["GDRIVE_FOLDER_ID"]
          creds_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "gdrive-service-account.json"
          creds = service_account.Credentials.from_service_account_file(
              str(creds_path),
              scopes=["https://www.googleapis.com/auth/drive.readonly"],
          )
          drive = build("drive", "v3", credentials=creds, cache_discovery=False)

          queue = [(folder_id, pathlib.Path())]
          visited = set()
          inventory = []
          while queue:
              parent_id, relative = queue.pop(0)
              if parent_id in visited:
                  continue
              visited.add(parent_id)
              page_token = None
              while True:
                  response = drive.files().list(
                      q=f"'{parent_id}' in parents and trashed=false",
                      fields="nextPageToken,files(id,name,mimeType,size,shortcutDetails(targetId,targetMimeType))",
                      pageToken=page_token,
                      pageSize=1000,
                  ).execute()
                  for entry in response.get("files", []):
                      item = entry
                      child_path = relative / entry["name"]
                      if entry["mimeType"] == "application/vnd.google-apps.shortcut":
                          target_id = (entry.get("shortcutDetails") or {}).get("targetId")
                          if not target_id:
                              print(f"WARNING: shortcut target unavailable: {child_path}")
                              continue
                          try:
                              item = drive.files().get(
                                  fileId=target_id,
                                  fields="id,name,mimeType,size,shortcutDetails",
                              ).execute()
                          except Exception as exc:
                              print(f"WARNING: cannot read shortcut {child_path}: {exc}")
                              continue
                      if item["mimeType"] == "application/vnd.google-apps.folder":
                          queue.append((item["id"], child_path))
                      else:
                          inventory.append({
                              "path": str(child_path),
                              "name": item.get("name", ""),
                              "mime_type": item.get("mimeType", ""),
                              "size": int(item.get("size", 0)),
                          })
                  page_token = response.get("nextPageToken")
                  if not page_token:
                      break

          extensions = {".nsp", ".nsz", ".xci", ".xcz"}
          games = [x for x in inventory if pathlib.Path(x["name"]).suffix.lower() in extensions]
          keys = [x for x in inventory if x["name"].lower() == "prod.keys"]
          print(f"Drive access confirmed. Found {len(games)} Switch game package(s) and {len(keys)} prod.keys file(s).")
          for item in sorted(inventory, key=lambda x: x["path"].lower()):
              print(f'{item["path"]} | {item["size"]:,} bytes | {item["mime_type"]}')
          if not games:
              raise SystemExit("No .nsp, .nsz, .xci, or .xcz game packages were found.")
          if len(keys) != 1:
              raise SystemExit(f"Expected exactly one prod.keys file; found {len(keys)}.")
          report = {
              "game_packages": games,
              "prod_keys_count": len(keys),
              "total_game_bytes": sum(x["size"] for x in games),
              "inventory": inventory,
          }
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "batman-drive-inventory.json"
          output.write_text(json.dumps(report, indent=2))
          print(f"Inventory report written to {output}")
          PY
          python "$RUNNER_TEMP/inventory_drive.py"
          rm -f "$RUNNER_TEMP/gdrive-service-account.json"

      - name: Upload private-input inventory
        uses: actions/upload-artifact@v4
        with:
          name: batman-drive-inventory
          path: ${{ runner.temp }}/batman-drive-inventory.json
          if-no-files-found: error
          retention-days: 3
