name: Test a-Shell over Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ashell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Connect GitHub Actions to iPhone over Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: 100.127.76.121

      - name: Check a-Shell HTTP server
        shell: bash
        run: |
          set -euo pipefail
          URL="http://100.127.76.121:8765/"
          echo "Checking a-Shell server at ${URL}"
          CODE=$(curl --silent --show-error --max-time 30 -o /tmp/ashell-index.html -w '%{http_code}' "${URL}")
          echo "HTTP status: ${CODE}"
          if [ "${CODE}" != "200" ]; then
            echo "::error::a-Shell returned HTTP ${CODE}"
            head -c 500 /tmp/ashell-index.html || true
            exit 1
          fi
          echo "Server responded successfully. Directory listing preview:"
          head -c 1000 /tmp/ashell-index.html
          echo
