name: Ni no Kuni II iPhone - Connectivity Check (Fresh Trigger)

on:
  push:
    branches:
      - ni-no-kuni-2-iphone
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-iphone-file-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Connect GitHub Actions to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: 100.127.76.121

      - name: Verify iPhone HTTP server and both game files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.parse import quote

          host = "http://100.127.76.121:8080/"
          files = [
              "Ni no Kuni II Revenant Kingdom PRINCE'S EDITION [0100BE7013E06000][v0].nsp",
              "Ni no Kuni II Revenant Kingdom PRINCE'S EDITION Switch NSP Update v65536.rar",
          ]

          print("Checking iPhone directory listing...")
          with urlopen(host, timeout=30) as response:
              print(f"Directory HTTP status: {response.status}")
              if response.status != 200:
                  raise SystemExit("iPhone directory listing did not return HTTP 200.")

          for filename in files:
              url = host + quote(filename, safe="")
              request = Request(url, method="HEAD")
              with urlopen(request, timeout=60) as response:
                  length = int(response.headers.get("Content-Length", "0"))
                  print(f"{filename}: HTTP {response.status}, {length:,} bytes")
                  if response.status != 200 or length <= 0:
                      raise SystemExit(f"File check failed: {filename}")

          print("SUCCESS: GitHub Actions can reach the iPhone and both Ni no Kuni II files.")
          PY
